name: Build TELEGRAM X for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # В проекте нет папки windows/ — создаём её (lib/ и pubspec.yaml не трогаются)
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name telegram_x .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TELEGRAM-X-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
